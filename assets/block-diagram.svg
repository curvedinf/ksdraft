<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img" aria-label="KSDraft block diagram">
  <style>
    .title { font: 700 32px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 18px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    .panel { font: 700 18px ui-sans-serif, system-ui, sans-serif; }
    .box { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .target-arrow { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" fill="#ffffff"/>

  <text x="700" y="58" text-anchor="middle" class="title">KSDraft</text>
  <text x="700" y="92" text-anchor="middle" class="subtitle">target-KV reuse drafter</text>

  <!-- target model -->
  <rect x="50" y="140" width="380" height="850" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="240" y="180" text-anchor="middle" class="panel" fill="#6d28d9">Target model (frozen)</text>

  <rect x="80" y="220" width="320" height="90" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="240" y="273" text-anchor="middle" class="box">Embedding table</text>

  <rect x="80" y="390" width="320" height="110" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="240" y="453" text-anchor="middle" class="box">KV cache (int8 g128)</text>

  <rect x="80" y="700" width="320" height="90" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="240" y="753" text-anchor="middle" class="box">Unembed table</text>

  <!-- draft trunk -->
  <rect x="500" y="140" width="580" height="850" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="790" y="180" text-anchor="middle" class="panel" fill="#1d4ed8">Draft trunk</text>

  <rect x="560" y="320" width="170" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="645" y="363" text-anchor="middle" class="box">Tokens</text>

  <path d="M 730 355 H 760 V 285 H 788" class="arrow"/>

  <rect x="790" y="220" width="230" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="905" y="263" text-anchor="middle" class="box">Embedding lookup</text>

  <path d="M 400 255 H 788" class="target-arrow"/>

  <path d="M 905 290 V 328" class="arrow"/>
  <rect x="790" y="330" width="230" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="905" y="373" text-anchor="middle" class="box">LayerNorm</text>
  <path d="M 905 400 V 428" class="arrow"/>

  <!-- reuse block stack -->
  <rect x="556" y="446" width="500" height="410" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="548" y="438" width="500" height="410" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <rect x="540" y="430" width="500" height="410" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="790" y="470" text-anchor="middle" class="panel" fill="#1d4ed8">ReuseBlock × 4</text>

  <rect x="580" y="490" width="160" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="660" y="528" text-anchor="middle" class="box">LayerNorm</text>

  <path d="M 740 520 H 778" class="arrow"/>

  <rect x="780" y="480" width="200" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="880" y="527" text-anchor="middle" class="box">Target-KV Attention</text>

  <path d="M 980 520 H 1000" class="arrow"/>
  <circle cx="1015" cy="520" r="15" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1015" y="526" text-anchor="middle" class="box">+</text>

  <path d="M 570 520 V 482 H 1015 V 503" class="arrow"/>

  <path d="M 1015 535 V 590 H 570 V 630 H 578" class="arrow"/>

  <rect x="580" y="600" width="160" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="660" y="638" text-anchor="middle" class="box">LayerNorm</text>

  <path d="M 740 630 H 778" class="arrow"/>

  <rect x="780" y="590" width="200" height="80" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="880" y="637" text-anchor="middle" class="box">KS3 Decoder</text>

  <path d="M 980 630 H 1000" class="arrow"/>
  <circle cx="1015" cy="630" r="15" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1015" y="636" text-anchor="middle" class="box">+</text>

  <path d="M 570 590 V 680 H 1015 V 647" class="arrow"/>

  <path d="M 1030 630 H 1032 V 745 H 1002" class="arrow"/>

  <rect x="580" y="710" width="420" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="790" y="753" text-anchor="middle" class="box">Adjacent Injection</text>

  <path d="M 790 780 V 818" class="arrow"/>

  <rect x="700" y="820" width="220" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="810" y="863" text-anchor="middle" class="box">LayerNorm</text>

  <path d="M 810 890 V 908" class="arrow"/>

  <rect x="700" y="910" width="220" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="810" y="948" text-anchor="middle" class="box">Anchor</text>

  <path d="M 920 940 H 1080 V 860 H 1118" class="arrow"/>

  <!-- block head -->
  <rect x="1120" y="760" width="230" height="200" rx="14" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="1235" y="795" text-anchor="middle" class="panel" fill="#be123c">Block head</text>
  <text x="1235" y="835" text-anchor="middle" class="box">BlockConv + Δ</text>
  <text x="1235" y="875" text-anchor="middle" class="box">Unembed logits</text>
  <text x="1235" y="915" text-anchor="middle" class="box">Greedy walk</text>
  <text x="1235" y="945" text-anchor="middle" class="box" fill="#be123c">Draft tokens</text>

  <path d="M 400 745 H 430 V 120 H 1235 V 758" class="target-arrow"/>

  <path d="M 400 445 H 760 V 520 H 778" class="target-arrow"/>
</svg>
